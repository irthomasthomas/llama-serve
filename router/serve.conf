# ============================================================================
# router/serve.conf — bash-sourced configuration for the router launcher.
#   Source this file, then start the router + resident standalone servers.
# ============================================================================

# --- Binary ---------------------------------------------------------------
LLAMA_BIN="/home/thomas/llama.cpp/build_optimized/bin/llama-server"

# --- Router (single OpenAI-compatible chat/VL endpoint) -------------------
LLAMA_ROUTER_PORT=8080
PRESETS_FILE="/home/thomas/work/llama-serve-modern/router/presets.ini"
# Maximum number of model instances the router loads concurrently.
MODELS_MAX=2
# Seconds of idleness before a router model instance is put to sleep.
SLEEP_IDLE=300

# --- Machine-wide resident set -------------------------------------------
# Models the launcher guarantees stay warm somewhere on the box. With
# MODELS_MAX=2 the router cannot host all of them concurrently, so the two
# tiny always-on services run as *standalone* llama-server processes on their
# own ports (outside the router's eviction budget), and the other two load via
# the router's `load-on-startup` preset key:
#   lfm-embedding -> standalone always-on on :8085 (embeddings)
#   lfm-colbert   -> standalone always-on on :8086 (reranker)
#   lfm2-vl-450m  -> router load-on-startup
#   lfm-1.2b      -> router load-on-startup (also the lfm-8b spec-draft model)
RESIDENT=(lfm-embedding lfm-colbert lfm2-vl-450m lfm-1.2b)

# --- Dedicated always-on ports (kept outside the router) ------------------
EMBEDDING_PORT=8085
RERANKER_PORT=8086

# --- GPU environment ------------------------------------------------------
# CRITICAL (see FACTS.md): agent shells export a GPU-guard LD_PRELOAD and
# CUDA_VISIBLE_DEVICES="" which force llama-server onto CPU silently. Every
# launch path MUST strip/override them.
GPU_ENV="env -u LD_PRELOAD CUDA_VISIBLE_DEVICES=0"
