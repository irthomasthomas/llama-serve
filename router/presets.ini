# ============================================================================
# router/presets.ini — llama-server router-mode model presets (b9139)
#   Run with:  llama-server --models-preset router/presets.ini \
#                              --models-max 2 --sleep-idle-seconds 300 \
#                              --port 8080 --host 0.0.0.0
#
# INI grammar (verified in llama.cpp/common/preset.cpp + tools/server/README.md):
#   * Section header [<name>]        -> router routing key (== meta.name).
#   * Keys are CLI flags w/o leading dashes (long, short, or LLAMA_ARG_ env name).
#   * The router ALSO parses `alias = a,b,c` as extra routing keys, so we keep
#     the short registry name as the section and add the OpenAI-style alias.
#   * load-on-startup / stop-timeout are preset-only keys (not in --help);
#     see allowlist in tests/test_presets.sh. (The optional `version = 1` key
#     is omitted so the file also parses with stdlib python `configparser`.)
#   * Global [*] keys cascade into every section (lowest precedence).
# ============================================================================

# ----------------------------------------------------------------------------
# Global defaults shared by every preset (overridable per-section).
# These mirror the flags the legacy launcher passed to every model.
# ----------------------------------------------------------------------------
[*]
n-gpu-layers  = 99          # full GPU offload
cache-reuse   = 256         # min chunk for KV-shift reuse
flash-attn    = on          # FlashAttention
cache-type-k  = q8_0        # quantised K cache
cache-type-v  = q8_0        # quantised V cache
jinja         = true        # jinja chat templates
threads       = 8
threads-batch = 16
cont-batching = true        # -cb
parallel      = 1           # -np 1 (v2 parity; KV per seq halved)

# ============================================================================
# Chat models
# ============================================================================

[lfm-8b]
# Primary chat model (telegram contract: model=lfm2.5-8b-a1b).
# Speculation: --spec-type ngram-simple (SELF-speculative, no draft model).
# A draft MODEL is impossible: no smaller LFM2.5 shares the 8B vocab (128000);
# 1.2b/350M/230M are all 65536 -> "vocabs are not compatible" (verified live).
model            = /home/thomas/models/LFM2.5-8B-A1B-GGUF/LFM2.5-8B-A1B-Q6_K.gguf
alias            = lfm2.5-8b-a1b
ctx-size         = 65536
temp             = 0.2
top-k            = 80
repeat-penalty   = 1.05
spec-type        = ngram-mod

[lfm-8b-base]
model          = /home/thomas/models/8B-A1B-Base-GGUF/LFM2.5-8B-A1B-Base-Q6_K.gguf
alias          = lfm2.5-8b-a1b-base
ctx-size       = 65536
temp           = 0.2
top-k          = 80
repeat-penalty = 1.05

[lfm-1.2b]
# Router-resident: small, doubles as the lfm-8b draft model.
model          = /home/thomas/models/LFM2.5-1.2B-Instruct-GGUF/LFM2.5-1.2B-Instruct-Q4_K_M.gguf
alias          = lfm2.5-1.2b-instruct
ctx-size       = 32768        # was 128000: 1.5GB q8 KV squeezed lfm-8b off the 12GB card
load-on-startup = true
stop-timeout   = 10

[vibethinker-3b]
model    = /home/thomas/models/VibeThinker-3B-GGUF/VibeThinker-3B.Q5_K_M.gguf
alias    = vibethinker-3b
ctx-size = 131072
reasoning = auto

[fastcontext-rl]
model    = /home/thomas/models/FastContext-1.0-4B-RL-GGUF/FastContext-1.0-4B-RL.Q6_K.gguf
alias    = fastcontext-4b-rl
ctx-size = 65536

[fastcontext-sft]
model    = /home/thomas/models/FastContext-1.0-4B-SFT-Q5_K_M/fastcontext-1.0-4b-sft-q5_k_m.gguf
alias    = fastcontext-4b-sft
ctx-size = 65536

# ============================================================================
# Embedding / rerank models
#   In production these run as standalone always-on servers (see serve.conf +
#   README): embedding on :8085, colbert on :8086 — outside the router's
#   MODELS_MAX budget so they are never evicted and have zero cold-start.
#   They are defined here too so the router can serve them on :8080 if asked.
# ============================================================================

[lfm-embedding]
model    = /home/thomas/models/Embedding-350M-GGUF/LFM2.5-Embedding-350M-F16.gguf
alias    = lfm2.5-embedding-350m
ctx-size = 8192
embedding = true
pooling   = mean

[lfm-colbert]
model    = /home/thomas/models/ColBERT-350M-GGUF/LFM2.5-ColBERT-350M-F16.gguf
alias    = lfm2-colbert-350m
ctx-size = 8192
rerank   = true
pooling  = rank

# ============================================================================
# Vision-language models
# ============================================================================

[lfm2-vl-450m]
# On-demand VL (NOT load-on-startup): with models-max=2, one slot stays free
# so a chat swap (e.g. lfm-8b, ~7.3GB) only has to evict ONE resident model.
model          = /home/thomas/models/LFM2.5-VL-450M-GGUF/LFM2.5-VL-450M-Q8_0.gguf
alias          = lfm2.5-vl-450m
ctx-size       = 8192
mmproj         = /home/thomas/models/LFM2.5-VL-450M-GGUF/mmproj-LFM2.5-VL-450m-Q8_0.gguf
stop-timeout   = 10

[lfm2-vl-1.6b]
model    = /home/thomas/.cache/huggingface/hub/models--LiquidAI--LFM2.5-VL-1.6B-GGUF/snapshots/0df8719db7180cedababc2bc589abfe5e8ebcd1f/LFM2.5-VL-1.6B-Q8_0.gguf
alias    = lfm2.5-vl-1.6b
ctx-size = 32768
mmproj   = /home/thomas/.cache/huggingface/hub/models--LiquidAI--LFM2.5-VL-1.6B-GGUF/snapshots/0df8719db7180cedababc2bc589abfe5e8ebcd1f/mmproj-LFM2.5-VL-1.6b-Q8_0.gguf
